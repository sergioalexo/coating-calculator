<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Coating Calculator">
  <defs>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#0B1220"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>

  <!-- Coating droplet -->
  <path d="M16 4.5c0 0-6.2 6.9-6.2 10.3a6.2 6.2 0 0 0 12.4 0c0-3.4-6.2-10.3-6.2-10.3z" fill="url(#drop)"/>
  <path d="M12.6 16.6a3.4 3.4 0 0 0 2.2 3.2" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Coated surface -->
  <rect x="4" y="23.2" width="24" height="5.6" rx="2.8" fill="url(#slab)"/>
  <rect x="4" y="23.2" width="24" height="2" rx="1" fill="#BAE6FD" fill-opacity="0.8"/>
</svg>
